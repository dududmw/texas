<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGL 光线追踪场景</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#080c12;font-family:system-ui,"PingFang SC",sans-serif;color:#edf3ff}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:1;top:32px;left:38px;pointer-events:none}.embed .hud{display:none}.hud p{margin:0 0 7px;color:#83b9ff;font-size:11px;font-weight:800;letter-spacing:.17em}.hud h1{margin:0;font-size:clamp(28px,5vw,54px);line-height:.92;letter-spacing:-.06em}.hud span{display:block;margin-top:12px;color:#b3bdca;font-size:14px}.error{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#11151c;color:#fff}.error p{color:#c4cbd7}
</style></head><body><canvas id="canvas" aria-label="WebGL 光线追踪 50 筹码"></canvas><div class="hud"><p>WEBGL RAY TRACING</p><h1>50<br>Chip</h1><span>筹码、平面、阴影与光照</span></div><div class="error" id="error"><div><h2>WebGL 无法初始化</h2><p id="error-message">请检查浏览器硬件加速设置。</p></div></div><script>
if(window.self!==window.top)document.body.classList.add('embed');const canvas=document.querySelector('#canvas'),error=document.querySelector('#error'),gl=canvas.getContext('webgl',{antialias:false});if(!gl){error.style.display='grid';throw Error('WebGL unavailable')}
const vertex='attribute vec2 position;void main(){gl_Position=vec4(position,0.0,1.0);}';
const fragment=`precision mediump float;uniform vec2 resolution;uniform float time;const float FAR=50.0;const float EPS=0.003;const float PI=3.14159265;struct Ray{vec3 origin;vec3 direction;};struct Hit{float distance;vec3 point;vec3 normal;vec3 color;};
float stroke(vec2 p,vec2 a,vec2 b){vec2 q=p-a,v=b-a;return length(q-v*clamp(dot(q,v)/dot(v,v),0.0,1.0));}float glyphDistance(vec2 p,float value){float a=stroke(p,vec2(-.09,.16),vec2(.09,.16)),b=stroke(p,vec2(.09,.16),vec2(.09,0.0)),c=stroke(p,vec2(.09,0.0),vec2(.09,-.16)),d=stroke(p,vec2(-.09,-.16),vec2(.09,-.16)),e=stroke(p,vec2(-.09,0.0),vec2(-.09,-.16)),f=stroke(p,vec2(-.09,.16),vec2(-.09,0.0)),g=stroke(p,vec2(-.09,0.0),vec2(.09,0.0));float zero=min(min(min(a,b),min(c,d)),min(e,f));float one=min(b,c);float two=min(min(min(a,b),g),min(e,d));float five=min(min(min(a,f),min(g,c)),d);return value<.5?zero:(value<1.5?one:(value<2.5?two:five));}float digit(vec2 p,float value){return 1.0-smoothstep(.023,.028,glyphDistance(p,value));}float digitOutline(vec2 p,float value){return 1.0-smoothstep(.030,.037,glyphDistance(p,value));}float label(vec2 p,float value){vec2 centered=p;if(value>45.0&&value<55.0)return max(digit(centered+vec2(.15,0.0),5.0),digit(centered-vec2(.15,0.0),0.0));return 0.0;}float labelOutline(vec2 p,float value){vec2 centered=p;if(value>45.0&&value<55.0)return max(digitOutline(centered+vec2(.15,0.0),5.0),digitOutline(centered-vec2(.15,0.0),0.0));return 0.0;}
bool chip(Ray ray,vec3 center,float radius,float halfHeight,float value,vec3 color,inout Hit hit){float angle=time*.65+sin(time*.41)*.22+sin(time*.13)*.12,ca=cos(angle),sa=sin(angle);vec3 ro=ray.origin-center,rd=ray.direction;ro.xz=mat2(ca,sa,-sa,ca)*ro.xz;rd.xz=mat2(ca,sa,-sa,ca)*rd.xz;float best=hit.distance,a=dot(rd.xy,rd.xy),b=2.0*dot(ro.xy,rd.xy),c=dot(ro.xy,ro.xy)-radius*radius,d=b*b-4.0*a*c;vec3 normal=vec3(0.0);if(d>=0.0&&a>0.00001){float root=sqrt(d),k=(-b-root)/(2.0*a),z=ro.z+rd.z*k;if(k>EPS&&k<best&&abs(z)<=halfHeight){best=k;vec3 p=ro+rd*k;normal=normalize(vec3(p.x,p.y,0.0));}k=(-b+root)/(2.0*a);z=ro.z+rd.z*k;if(k>EPS&&k<best&&abs(z)<=halfHeight){best=k;vec3 p=ro+rd*k;normal=normalize(vec3(p.x,p.y,0.0));}}if(abs(rd.z)>0.00001){float k=(halfHeight-ro.z)/rd.z;vec3 p=ro+rd*k;if(k>EPS&&k<best&&dot(p.xy,p.xy)<=radius*radius){best=k;normal=vec3(0.0,0.0,1.0);}k=(-halfHeight-ro.z)/rd.z;p=ro+rd*k;if(k>EPS&&k<best&&dot(p.xy,p.xy)<=radius*radius){best=k;normal=vec3(0.0,0.0,-1.0);}}if(best>=hit.distance)return false;vec3 local=ro+rd*best;float cap=abs(normal.z),radial=length(local.xy)/radius;vec2 faceUv=normal.z<0.0?vec2(-local.x,local.y):local.xy;normal.xz=mat2(ca,-sa,sa,ca)*normal.xz;hit.distance=best;hit.point=ray.origin+ray.direction*best;hit.normal=normal;float segment=step(.68,fract((atan(local.y,local.x)+PI)/(2.0*PI)*12.0));float outerRing=smoothstep(.755,.765,radial)*(1.0-smoothstep(.915,.925,radial));float innerRing=smoothstep(.595,.603,radial)*(1.0-smoothstep(.647,.655,radial));float edgeGroove=(1.0-cap)*(.5+.5*sin((local.z+halfHeight)/max(halfHeight*2.0,.01)*18.85));float mark=cap>.8?label(faceUv,value):0.0,outline=cap>.8?labelOutline(faceUv,value):0.0;vec3 charcoal=color*(.88+.12*(1.0-radial));vec3 engraving=vec3(.34,.37,.41);float faceDetail=max(outerRing*.78,innerRing*.35);float sideDetail=segment*(1.0-cap)*.42+edgeGroove*.10;hit.color=mix(charcoal,engraving,faceDetail+sideDetail);hit.color=mix(hit.color,vec3(.006,.008,.011),outline);hit.color=mix(hit.color,vec3(.39,.42,.46),mark);return true;}
bool floorPlane(Ray ray,inout Hit hit){if(abs(ray.direction.y)<0.0001)return false;float k=(-1.05-ray.origin.y)/ray.direction.y;if(k<EPS||k>=hit.distance)return false;hit.distance=k;hit.point=ray.origin+ray.direction*k;hit.normal=vec3(0.0,1.0,0.0);vec2 weave=hit.point.xz*2.25;vec2 cell=abs(fract(weave)-.5);float thread=min(cell.x,cell.y);float grid=1.0-smoothstep(.365,.495,thread);float fine=sin(weave.x*6.283)*sin(weave.y*6.283);vec3 felt=vec3(.025,.255,.105);hit.color=felt*(.91+fine*.035)-vec3(.010,.060,.024)*grid;return true;}
bool scene(Ray ray,inout Hit hit){bool found=false;found=chip(ray,vec3(0.0,-0.33,-0.45),0.72,0.06,50.0,vec3(0.025,0.028,0.036),hit)||found;found=floorPlane(ray,hit)||found;return found;}
float visibility(vec3 point,vec3 direction){Hit h;h.distance=FAR;return scene(Ray(point,direction),h)?0.0:1.0;}float shadow(vec3 point,vec3 lightDirection){vec3 tangent=normalize(cross(lightDirection,vec3(0.0,1.0,0.0)));if(length(tangent)<.01)tangent=vec3(1.0,0.0,0.0);float spread=.035;return(.20+.80*(visibility(point,lightDirection)+visibility(point,normalize(lightDirection+tangent*spread))+visibility(point,normalize(lightDirection-tangent*spread)))/3.0);}
vec3 sky(vec3 direction){float height=clamp(direction.y*.5+.5,0.0,1.0);float haze=.5+.5*sin(direction.x*7.0+direction.y*4.0)*sin(direction.y*9.0-direction.z*3.0);vec3 base=mix(vec3(.004,.005,.007),vec3(.022,.024,.028),height);base+=vec3(.008,.009,.011)*haze*(1.0-height)*.12;vec3 beamDirection=normalize(vec3(-.42,.38,-1.0));float bloom=pow(max(dot(normalize(direction),beamDirection),0.0),20.0);return base+vec3(.14,.105,.055)*bloom;}
void main(){vec2 uv=(gl_FragCoord.xy*2.0-resolution.xy)/min(resolution.x,resolution.y);vec3 eye=vec3(-4.20,2.45,4.5);Ray ray=Ray(eye,normalize(vec3(uv.x,uv.y-0.12,-1.5)));Hit hit;hit.distance=FAR;vec3 finalColor=sky(ray.direction);if(scene(ray,hit)){vec3 lamp=vec3(3.10,3.55,2.35),aim=vec3(0.0,-.32,-.45),toLamp=lamp-hit.point;float lampDistance=length(toLamp);vec3 key=toLamp/lampDistance,spotDirection=normalize(aim-lamp);float cone=pow(max(dot(normalize(hit.point-lamp),spotDirection),0.0),22.0),spotPower=cone/(1.0+lampDistance*lampDistance*.16);vec3 fill=normalize(vec3(0.65,0.35,0.15));float keyDiffuse=max(dot(hit.normal,key),0.0),fillDiffuse=max(dot(hit.normal,fill),0.0),keyVisibility=shadow(hit.point+hit.normal*EPS,key);vec3 keyHalf=normalize(key-ray.direction),fillHalf=normalize(fill-ray.direction);float keySpecular=pow(max(dot(hit.normal,keyHalf),0.0),136.0),fillSpecular=pow(max(dot(hit.normal,fillHalf),0.0),28.0),rim=pow(1.0-max(dot(hit.normal,-ray.direction),0.0),3.0);float ambient=.04+.025*max(hit.normal.y,0.0);finalColor=hit.color*(ambient+keyDiffuse*keyVisibility*spotPower*5.6+fillDiffuse*.08)+vec3(1.0,.88,.70)*keySpecular*keyVisibility*spotPower*7.5+vec3(.36,.58,1.0)*fillSpecular*.05+vec3(.35,.62,.42)*rim*.10;}finalColor=finalColor/(finalColor+vec3(1.0));gl_FragColor=vec4(pow(finalColor,vec3(0.4545)),1.0);}`;
function compile(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader}
try{const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const position=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);const resolution=gl.getUniformLocation(program,'resolution'),time=gl.getUniformLocation(program,'time');function draw(now){const scale=Math.min(devicePixelRatio||1,1.7),w=Math.floor(innerWidth*scale),h=Math.floor(innerHeight*scale);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(resolution,w,h);gl.uniform1f(time,now*.001);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw)}requestAnimationFrame(draw)}catch(exception){console.error(exception);document.querySelector('#error-message').textContent='着色器初始化失败：'+exception.message;error.style.display='grid'}
</script></body></html>
