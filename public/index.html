<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地德州扑克</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <section id="auth" class="card"><h1>♠ 本地德州扑克</h1><p>多人实时牌桌 · 本地积分</p><input id="username" placeholder="用户名（3-20 位）" autocomplete="username"><input id="password" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password"><div class="row"><button id="login">登录</button><button class="secondary" id="register">注册</button></div><small id="auth-error"></small></section>
  <section id="game" hidden><header><b>♠ 德州扑克</b><span id="account"></span><button class="secondary" id="music">♫ 氛围音乐：关</button><button class="secondary" id="logout">退出</button></header><div class="layout">
    <aside class="card"><h2>新手牌桌</h2><p id="table-info">连接中…</p><button id="join">入座（1000 积分）</button><button class="secondary" id="leave" hidden>本局结束后下桌</button><button class="secondary" id="spectate">旁观</button><small id="seat-status"></small><hr><p>小盲 / 大盲：10 / 20</p><p>每回合 25 秒；超时无须跟注时自动过牌，否则自动弃牌。</p><p>获胜的筹码在离桌时返还至账户。</p></aside>
    <div class="game-area" id="game-area"><section class="table card"><div id="message">等待连接</div><div id="turn-status"></div><div id="board" class="cards"></div><div id="pot">底池：0</div><div id="players" class="players"></div></section><section class="control-panel"><div id="self" class="self"></div><div id="actions" class="actions"></div></section></div>
  </div></section>
</main><script src="/app.js"></script></body></html>
